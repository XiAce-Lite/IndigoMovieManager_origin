name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for real DMM identifiers
        shell: pwsh
        run: ./tools/Check-NoRealDmmIdentifiers.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IndigoMovieManager.sln -p:Platform=x64 -r win-x64

      - name: Build
        run: dotnet build IndigoMovieManager.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test IndigoMovieManager.sln -c Release -p:Platform=x64 --no-build --verbosity normal

  changes:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release:
              - 'IndigoMovieManager.csproj'
              - 'IndigoMovieManager.sln'
              - '*.cs'
              - '*.xaml'
              - 'Converter/**'
              - 'Data/**'
              - 'Images/**'
              - 'ModelViews/**'
              - 'Properties/**'
              - 'Services/**'
              - 'Skins/**'
              - 'Thumbnail/**'
              - 'UserControls/**'

  release:
    needs: [build, changes]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.changes.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump version for release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/bump-version.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IndigoMovieManager.csproj -p:Platform=x64 -r win-x64

      - name: Publish distribution
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish'
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish IndigoMovieManager.csproj -c Release -p:Platform=x64 --no-restore `
            -p:StandardDistributionPublish=true `
            -p:PublishDir="$publishDir\"

      - name: Read version and prepare release
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Get-Content IndigoMovieManager.csproj -Raw -Encoding UTF8
          if ($content -notmatch '<FileVersion>(?<ver>\d+\.\d+\.\d+\.\d+)</FileVersion>') {
            throw 'FileVersion not found in IndigoMovieManager.csproj'
          }
          $version = $Matches.ver
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'
          & ./tools/Build-ReleaseNotes.ps1 -Version $version -RepoRoot $env:GITHUB_WORKSPACE -OutputPath $notesPath | Out-Null

          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish'
          if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found: $publishDir"
          }

          $sinkuFiles = @('sinku.exe', 'Sinku.dll', 'codecs.ini', 'format.ini')
          foreach ($name in $sinkuFiles) {
            $path = Join-Path $publishDir $name
            if (Test-Path $path) {
              throw "Distribution must not include sinku file: $name"
            }
          }

          $looseDlls = Get-ChildItem -Path $publishDir -Filter '*.dll' -File -ErrorAction SilentlyContinue
          if ($looseDlls -and $looseDlls.Count -gt 0) {
            throw "Distribution must be SingleFile (loose DLLs found: $($looseDlls.Name -join ', '))"
          }

          $exePath = Join-Path $publishDir 'IndigoMovieManager.exe'
          if (-not (Test-Path $exePath)) {
            throw 'IndigoMovieManager.exe not found in publish output'
          }

          $exeLength = (Get-Item $exePath).Length
          if ($exeLength -lt 50MB) {
            throw "IndigoMovieManager.exe is too small for SingleFile publish ($exeLength bytes)"
          }

          $zipName = "IndigoMovieManager-v$version-win-x64.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipName
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.release.outputs.zip_name }}

      - name: Commit bumped version and clear release notes draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          & ./tools/Clear-ReleaseNotesChanges.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          git add IndigoMovieManager.csproj docs/release-notes-changes.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: リリース用にバージョンを更新し変更点下書きをクリア [skip ci]"
            git push
          }

