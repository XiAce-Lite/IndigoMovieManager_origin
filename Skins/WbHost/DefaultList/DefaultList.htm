<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
	<link type="text/css" rel="stylesheet" href="./DefaultList.css">
	
	<!-- 以下の２つのjsは必須 -->
	<script type="text/javascript" src="../prototype.js"></script>
	<script type="text/javascript" src="../wblib.js"></script>
</head>

<body>
	<!-- サムネイル作成 -->
	<script type="text/javascript">
		wb.onCreateThum = function(mv, dir)
		{
			var tags = "";
			
			for(var i=0;i<mv.tags.length;i++){
				tags += "<li><a href=\"javascript:wb.find('" + wb.htmlDecode(mv.tags[i]) + "')\">" + mv.tags[i] + "</a>";
				tags += "<a href=\"javascript:wb.removeTag(" + mv.id + ",'" + wb.htmlDecode(mv.tags[i]) + "')\" class=\"a_remove\">[x]</a>";
			}
			
			var exist = (mv.exist == false) ? " style=\"filter:Gray\"" : "";
			var select = (mv.select == 1) ? "thum_select" : "thum";
			var insert = (dir < 0) ? Insertion.Top : Insertion.Bottom;
			
			new insert($("view"), ' \
				<tr class="' + select + '" id="thum' + mv.id + '"> \
					<td> \
						<img class="img_thum" id="img' + mv.id + '" src="' + mv.thum + '"' + exist + '> \
					</td> \
					<td> \
						<h3 id="title' + mv.id + '">' + mv.title + mv.ext + '</h3> \
						<ul id="tag' + mv.id + '">' + tags + '</ul> \
					</td> \
					<td><h4>' + mv.size + '</h4></td> \
					<td><h4>' + mv.len + '</h4></td> \
					<td><h4 id="score' + mv.id + '">' + mv.score + '</h4></td> \
					<td><h4>' + mv.drive + mv.dir + '</h4></td> \
					<td><h4>' + mv.container + '</h4></td> \
					<td><h4>' + mv.video + '</h4><br><h4>' + mv.audio + '</h4></td> \
				</tr>'
			);
		}
	</script>
	
	<!-- サムネイル表示エリア -->
	<div id="scroll">
		<table>
			<thead>
				<tr>
					<th>&nbsp;</th>
					<th>ファイル名</th>
					<th>サイズ</th>
					<th>再生時間</th>
					<th>スコア</th>
					<th>フォルダ</th>
					<th>コンテナ</th>
					<th>コーデック</th>
				</tr>
			</thead>
			<tbody id="view">
			</tbody>
		</table>
	</div>
	
	<!-- コンフィグ -->
	<div id="config">
		skin-version :		1;
		multi-select :		1;
		seamless-scroll :	2;
		thum-width : 		56;
		thum-height : 		42;
		thum-column : 		5;
		thum-row : 			1;
		scroll-id :			scroll;
	</div>
</body>

</html>
